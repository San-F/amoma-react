name: CI

# Corre también en las ramas de trabajo: así se ve si algo falla ANTES de
# pasar el cambio a main (que es lo que publica la página).
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  claves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # todo el historial: una clave borrada sigue estando en los cambios viejos
      - name: Detector de claves (archivos)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --no-banner --redact /repo
      # --log-opts=HEAD: el historial de ESTA rama. Cada rama se revisa cuando se sube.
      - name: Detector de claves (historial)
        run: |
          docker run --rm -v "$PWD:/repo" -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact --log-opts=HEAD /repo

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - name: Ninguna clave secreta en lo que recibe el navegador
        run: bash scripts/comprobar-armado.sh dist
      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar el navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador (pedido, fondo quieto, panel)
        run: npm run test:e2e
      - name: Guardar capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas-e2e
          path: .e2e/capturas
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Migraciones + tests de permisos (RLS)
        run: bash supabase/tests/run-local.sh
      - name: Backup de ida y vuelta (guardar, restaurar en otra base, comparar)
        run: bash supabase/tests/backup-ida-y-vuelta.sh

  # ¿Las pruebas sirven? Rompe a propósito cada regla de tests/casos-malos.json
  # y exige que la prueba correspondiente falle. Si una rotura "sobrevive",
  # hay una regla que se puede romper sin que nada avise.
  casos-malos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Casos malos (roturas a propósito)
        run: npm run casos-malos
