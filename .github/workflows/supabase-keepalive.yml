# Evita que el proyecto gratis de Supabase se pause por inactividad (7 días).
# Hace una lectura pública mínima cada 3 días. Usa solo datos PÚBLICOS
# (URL + publishable key), cargados como "Variables" del repo, no secretos.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 11 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Lectura mínima
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"
          test "$status" = "200"
