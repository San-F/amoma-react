# Copia de seguridad semanal de los DATOS de la base (el esquema ya está en
# supabase/migrations). Se guarda ENCRIPTADA en la rama "backups", así puede
# vivir en un repo público sin exponer datos de clientes.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL      cadena de conexión del "Session pooler" (IPv4)
#   BACKUP_PASSPHRASE    frase larga para encriptar (guardarla aparte)
#
# Restaurar:  gpg -d backup.sql.gpg > backup.sql  y  psql "$DB_URL" -f backup.sql
name: Supabase backup

on:
  schedule:
    - cron: "43 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency: supabase-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKUPS_ENABLED == 'true' }}
    steps:
      - name: Dump de datos (public + storage metadata)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e DB_URL postgres:17 sh -c \
            'pg_dump "$DB_URL" --data-only --schema=public --schema=storage --no-owner --no-privileges' \
            > backup.sql
          test -s backup.sql

      - name: Encriptar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.sql.gpg backup.sql
          shred -u backup.sql

      - name: Guardar en la rama "backups"
        run: |
          git init -q repo && cd repo
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin backups && git checkout -q backups || git checkout -q --orphan backups
          mkdir -p db && mv ../backup.sql.gpg "db/backup-$(date -u +%Y-%m-%d).sql.gpg"
          ls -1 db/*.gpg | sort -r | tail -n +13 | xargs -r git rm -q   # guarda las últimas 12 semanas
          git add db
          git -c user.name="backup-bot" -c user.email="backup-bot@users.noreply.github.com" \
            commit -q -m "Backup $(date -u +%Y-%m-%d)"
          git push -q origin backups
